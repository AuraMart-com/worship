<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Camera Stream</title>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    body { font-family: sans-serif; background: #111; color: #fff; text-align: center; margin: 0; padding: 20px; }
    video { width: 100%; max-width: 800px; background: #000; border-radius: 8px; margin-top: 15px; }
    button { padding: 12px 20px; font-size: 16px; font-weight: bold; margin: 10px; cursor: pointer; border-radius: 6px; border: none; }
    .btn-pc { background: #007bff; color: white; }
    .btn-phone { background: #28a745; color: white; }
    #status { margin-top: 10px; color: #aaa; font-size: 14px; }
  </style>
</head>
<body>

  <h2>Webcam Streamer</h2>
  
  <div id="controls">
    <button class="btn-pc" onclick="startBroadcaster()">PC: Start Camera</button>
    <button class="btn-phone" onclick="startViewer()">Mobile: Watch Stream</button>
  </div>

  <div id="status">Select an option above to begin.</div>
  <video id="videoElement" autoplay playsinline muted></video>

  <script>
    // Choose a unique, hardcoded Peer ID for your camera
    const STREAM_ID = "my-home-pc-webcam-9988"; 
    const videoElem = document.getElementById('videoElement');
    const statusElem = document.getElementById('status');

    // 1. PC Broadcaster Logic
    async function startBroadcaster() {
      statusElem.innerText = "Requesting camera access...";
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        videoElem.srcObject = stream;

        const peer = new Peer(STREAM_ID);

        peer.on('open', (id) => {
          statusElem.innerText = "Broadcasting! Ready to stream to mobile.";
        });

        peer.on('call', (call) => {
          statusElem.innerText = "Mobile connected. Streaming...";
          call.answer(stream); // Send camera stream to phone
        });

        peer.on('error', (err) => {
          statusElem.innerText = "Error: " + err.type;
        });

      } catch (err) {
        statusElem.innerText = "Camera access denied or unavailable: " + err.message;
      }
    }

    // 2. Mobile Viewer Logic
    function startViewer() {
      statusElem.innerText = "Connecting to PC camera...";
      videoElem.muted = false; // Unmute on viewer

      const peer = new Peer();

      peer.on('open', () => {
        const call = peer.call(STREAM_ID, new MediaStream()); // Call PC ID

        call.on('stream', (remoteStream) => {
          statusElem.innerText = "Connected! Live feed playing.";
          videoElem.srcObject = remoteStream;
        });

        call.on('error', (err) => {
          statusElem.innerText = "Call error: " + err.message;
        });
      });

      peer.on('error', (err) => {
        statusElem.innerText = "Connection error. Ensure PC stream is running.";
      });
    }
  </script>
</body>
</html>
